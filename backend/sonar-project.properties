# Identificador único e organização no SonarCloud
sonar.projectKey=projeto-monorepo
sonar.organization=geegeovanna
sonar.projectName=Backend API Monorepo

# URL do serviço
sonar.host.url=https://sonarcloud.io

# Diretório que contém o código-fonte da aplicação (relativo à pasta backend)
sonar.sources=src

# Diretório e padrões de arquivos de teste
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts

# Caminho do relatório de cobertura no formato LCOV
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Arquivos e pastas excluídos da análise estática
sonar.exclusions=coverage/**,node_modules/**,dist/**,src/**/*.test.ts,src/**/*.spec.ts